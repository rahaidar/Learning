<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOOTER — Retro Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; cursor: crosshair; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ── Canvas ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// ── State ────────────────────────────────────────────────────────────────────
const S = { MENU: 0, PLAYING: 1, LEVEL_COMPLETE: 2, GAME_OVER: 3 };
let state = S.MENU;

// ── Input ────────────────────────────────────────────────────────────────────
const keys  = {};
const mouse = { x: 0, y: 0, down: false };
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup',   e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => {
  mouse.down = true;
  if (state === S.MENU) { startGame(); return; }
  if (state === S.GAME_OVER && gameOverAlpha >= 0.99) { state = S.MENU; blinkTimer = 0; gameOverAlpha = 0; }
});
canvas.addEventListener('mouseup', () => { mouse.down = false; });

// ── Global Game Vars ─────────────────────────────────────────────────────────
let score, highScore = 0, currentLevel;
let player, bullets, enemies, particles;
let spawnQueue, spawnTimer, spawnInterval, totalWaveEnemies, enemiesKilled;
let screenShake, levelTimer, gameOverAlpha, blinkTimer;
let bgOffset = 0;

// ── Level Definitions ────────────────────────────────────────────────────────
const LEVEL_DEFS = [
  { walkers:  8, runners:  0, tanks: 0, interval: 1.5 },
  { walkers: 12, runners:  4, tanks: 0, interval: 1.3 },
  { walkers: 10, runners:  8, tanks: 2, interval: 1.1 },
  { walkers: 20, runners: 10, tanks: 4, interval: 0.9 },
  { walkers: 28, runners: 14, tanks: 6, interval: 0.7 },
];

function getLevelDef(lvl) {
  const idx  = Math.min(lvl - 1, LEVEL_DEFS.length - 1);
  const base = LEVEL_DEFS[idx];
  if (lvl <= LEVEL_DEFS.length) return base;
  const extra = lvl - LEVEL_DEFS.length;
  return {
    walkers:  base.walkers  + extra * 6,
    runners:  base.runners  + extra * 4,
    tanks:    base.tanks    + extra * 2,
    interval: Math.max(0.3, base.interval - extra * 0.05),
  };
}

// ── Player ────────────────────────────────────────────────────────────────────
function createPlayer() {
  return {
    x: W / 2, y: H / 2,
    speed: 210,
    angle: 0,
    hp: 5, maxHp: 5,
    shootCD: 0, shootCDMax: 0.22,
    invTimer: 0, invDur: 1.0,
    animFrame: 0, animTimer: 0,
    moving: false,
    muzzleFlash: 0,
    radius: 13,
  };
}

function drawPlayer(p) {
  // Invincibility flicker
  if (p.invTimer > 0 && Math.floor(p.invTimer * 10) % 2 === 0) return;

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle);

  const bob      = p.moving ? Math.sin(p.animFrame * Math.PI * 0.5) * 2 : 0;
  const legShift = p.moving ? (p.animFrame < 2 ? 3 : -3) : 0;

  // Ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(2, 13 + bob, 12, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  ctx.fillStyle = '#2d4a2d';
  ctx.fillRect(-7, 4 + bob,            5, 9);
  ctx.fillRect( 2, 4 + bob + legShift, 5, 9);

  // Torso
  ctx.fillStyle = '#4a8a4a';
  ctx.fillRect(-9, -8 + bob, 18, 13);

  // Vest panels
  ctx.fillStyle = '#3a7a3a';
  ctx.fillRect(-6, -6 + bob, 5, 9);
  ctx.fillRect( 1, -6 + bob, 5, 9);

  // Head
  ctx.fillStyle = '#c8a070';
  ctx.beginPath();
  ctx.arc(0, -12 + bob, 7, 0, Math.PI * 2);
  ctx.fill();

  // Helmet (top half)
  ctx.fillStyle = '#2d5a2d';
  ctx.beginPath();
  ctx.arc(0, -15 + bob, 7.5, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(-7.5, -15 + bob, 15, 4);

  // Eye slit
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(1, -14 + bob, 5, 3);

  // Gun barrel (points right = facing direction)
  ctx.fillStyle = '#666';
  ctx.fillRect(5,  -2 + bob, 20, 4);
  // Grip
  ctx.fillStyle = '#444';
  ctx.fillRect(5,  -4 + bob, 8, 8);

  // Muzzle flash
  if (p.muzzleFlash > 0) {
    const a = p.muzzleFlash / 0.08;
    ctx.fillStyle = `rgba(255, 230, 80, ${a * 0.9})`;
    ctx.beginPath();
    ctx.arc(26, bob, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255, 255, 210, ${a})`;
    ctx.beginPath();
    ctx.arc(26, bob, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// ── Bullets ───────────────────────────────────────────────────────────────────
function fireBullet(p) {
  const cos = Math.cos(p.angle), sin = Math.sin(p.angle);
  bullets.push({ x: p.x + cos * 26, y: p.y + sin * 26, vx: cos * 640, vy: sin * 640, r: 4, age: 0 });
  p.muzzleFlash = 0.08;
}

function drawBullet(b) {
  ctx.save();
  ctx.shadowColor = '#ffe040';
  ctx.shadowBlur  = 14;
  ctx.fillStyle   = '#fffab0';
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle  = '#ffffff';
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ── Enemies ───────────────────────────────────────────────────────────────────
const ETYPES = {
  walker: { color: '#c0392b', dark: '#7b241c', hp: 2, speed: 80,  r: 11, score: 10 },
  runner: { color: '#e6b800', dark: '#9a7d0a', hp: 1, speed: 158, r: 8,  score: 15 },
  tank:   { color: '#8e44ad', dark: '#5b2c6f', hp: 6, speed: 48,  r: 16, score: 30 },
};

function spawnEdgePos() {
  const m = 44, edge = Math.floor(Math.random() * 4);
  if (edge === 0) return { x: Math.random() * W,     y: -m };
  if (edge === 1) return { x: W + m,                 y: Math.random() * H };
  if (edge === 2) return { x: Math.random() * W,     y: H + m };
  return           { x: -m,                 y: Math.random() * H };
}

function createEnemy(type) {
  const def = ETYPES[type];
  const pos = spawnEdgePos();
  return {
    ...pos, type,
    hp: def.hp, maxHp: def.hp,
    speed: def.speed, r: def.r,
    scoreVal: def.score,
    animT: Math.random() * 2,
    hitFlash: 0,
    zigAngle: 0, zigTimer: Math.random(),
  };
}

function buildQueue(def) {
  const q = [];
  for (let i = 0; i < def.walkers; i++) q.push('walker');
  for (let i = 0; i < def.runners; i++) q.push('runner');
  for (let i = 0; i < def.tanks;   i++) q.push('tank');
  for (let i = q.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [q[i], q[j]] = [q[j], q[i]];
  }
  return q;
}

function drawEnemy(e) {
  const def  = ETYPES[e.type];
  const bob  = Math.sin(e.animT * 5) * 2;
  const col  = e.hitFlash > 0 ? '#ffffff'  : def.color;
  const dark = e.hitFlash > 0 ? '#bbbbbb'  : def.dark;

  ctx.save();
  ctx.translate(e.x, e.y);

  // Ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath();
  ctx.ellipse(0, e.r + 3, e.r * 0.8, e.r * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  if (e.type === 'walker') {
    // Body circle
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(0, bob, e.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = dark;
    ctx.lineWidth = 2;
    ctx.stroke();
    // Eyes
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(-3.5, bob - 2, 2.5, 0, Math.PI * 2);
    ctx.arc( 3.5, bob - 2, 2.5, 0, Math.PI * 2);
    ctx.fill();
    // Jagged mouth
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-4, bob + 3);
    ctx.lineTo(-2, bob + 6);
    ctx.lineTo( 0, bob + 3);
    ctx.lineTo( 2, bob + 6);
    ctx.lineTo( 4, bob + 3);
    ctx.stroke();

  } else if (e.type === 'runner') {
    // Elongated body
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(0, bob, e.r * 0.65, e.r * 1.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = dark;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Big wild eyes
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(-3, bob - 2, 3,   0, Math.PI * 2);
    ctx.arc( 3, bob - 2, 3,   0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-2, bob - 3, 1.2, 0, Math.PI * 2);
    ctx.arc( 4, bob - 3, 1.2, 0, Math.PI * 2);
    ctx.fill();
    // Speed streak lines (behind the body on left)
    ctx.strokeStyle = dark;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-e.r - 5, bob - 3); ctx.lineTo(-e.r, bob - 3);
    ctx.moveTo(-e.r - 7, bob);     ctx.lineTo(-e.r - 1, bob);
    ctx.moveTo(-e.r - 5, bob + 3); ctx.lineTo(-e.r, bob + 3);
    ctx.stroke();

  } else { // tank
    // Armored square body
    ctx.fillStyle = col;
    ctx.fillRect(-e.r, -e.r + bob, e.r * 2, e.r * 2);
    ctx.strokeStyle = dark;
    ctx.lineWidth = 3;
    ctx.strokeRect(-e.r, -e.r + bob, e.r * 2, e.r * 2);
    // Plate seams
    ctx.strokeStyle = dark;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-e.r, bob); ctx.lineTo(e.r, bob);
    ctx.moveTo(0, -e.r + bob); ctx.lineTo(0, e.r + bob);
    ctx.stroke();
    // Visor slot
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(-e.r * 0.72, -e.r * 0.35 + bob, e.r * 1.44, e.r * 0.52);
    // Glowing visor
    ctx.fillStyle = 'rgba(180, 60, 255, 0.75)';
    ctx.fillRect(-e.r * 0.6, -e.r * 0.28 + bob, e.r * 1.2, e.r * 0.34);
  }

  // HP bar (only when damaged)
  if (e.hp < e.maxHp) {
    const bw = e.r * 2.5, bh = 4;
    const bx = -bw / 2, by = -e.r - 12;
    ctx.fillStyle = '#222';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = e.hp / e.maxHp > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), bh);
  }

  ctx.restore();
}

// ── Particles ─────────────────────────────────────────────────────────────────
function spawnDeathBurst(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const a   = Math.random() * Math.PI * 2;
    const spd = 70 + Math.random() * 130;
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 3 + Math.random() * 4, color, life: 1, decay: 1.1 + Math.random() });
  }
}

function spawnHitSpark(x, y) {
  for (let i = 0; i < 4; i++) {
    const a   = Math.random() * Math.PI * 2;
    const spd = 50 + Math.random() * 110;
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 2, color: '#ffe040', life: 1, decay: 4.5 });
  }
}

function tickParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.87;      p.vy *= 0.87;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * Math.max(0, p.life), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ── Background ────────────────────────────────────────────────────────────────
function drawBg(animating) {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, W, H);
  const gs  = 40;
  const off = animating ? bgOffset % gs : 0;
  ctx.strokeStyle = '#1b1b2e';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  for (let x = off - gs; x < W + gs; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = off - gs; y < H + gs; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

// ── Heart icon ────────────────────────────────────────────────────────────────
function drawHeart(cx, cy, color, r) {
  ctx.fillStyle = color;
  ctx.save();
  ctx.translate(cx, cy);
  // Two top circles + lower triangle
  ctx.beginPath();
  ctx.arc(-r * 0.5, -r * 0.2, r * 0.58, 0, Math.PI * 2);
  ctx.arc( r * 0.5, -r * 0.2, r * 0.58, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-r * 1.0,  r * 0.08);
  ctx.lineTo( r * 1.0,  r * 0.08);
  ctx.lineTo( 0,        r * 1.18);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHUD() {
  // Health hearts
  for (let i = 0; i < player.maxHp; i++)
    drawHeart(22 + i * 28, 26, i < player.hp ? '#e74c3c' : '#333', 10);

  // Score + Level
  ctx.fillStyle   = '#a0c4ff';
  ctx.font        = 'bold 15px "Courier New", monospace';
  ctx.textAlign   = 'right';
  ctx.fillText(`SCORE  ${String(score).padStart(6, '0')}`, W - 18, 28);
  ctx.fillText(`LEVEL  ${currentLevel}`,                   W - 18, 48);

  // Wave progress bar
  if (totalWaveEnemies > 0) {
    const pct = enemiesKilled / totalWaveEnemies;
    const bw  = 220, bh = 7;
    const bx  = W / 2 - bw / 2, by = H - 22;
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#4ecdc4';
    ctx.fillRect(bx, by, bw * pct, bh);
    ctx.fillStyle   = '#6a6a8a';
    ctx.font        = '11px "Courier New", monospace';
    ctx.textAlign   = 'center';
    ctx.fillText(`${enemiesKilled} / ${totalWaveEnemies} enemies`, W / 2, by - 5);
  }
  ctx.textAlign = 'left';
}

// ── Menu Screen ───────────────────────────────────────────────────────────────
function drawMenu(dt) {
  bgOffset += 28 * dt;
  drawBg(true);

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 2);

  ctx.textAlign = 'center';

  // Title
  const titleSize = Math.min(90, Math.floor(W / 9));
  ctx.shadowColor = '#4ecdc4';
  ctx.shadowBlur  = 28;
  ctx.fillStyle   = '#ffffff';
  ctx.font        = `bold ${titleSize}px "Courier New", monospace`;
  ctx.fillText('SHOOTER', W / 2, H / 2 - 90);

  ctx.shadowBlur = 6;
  ctx.fillStyle  = '#4ecdc4';
  ctx.font       = '17px "Courier New", monospace';
  ctx.fillText('— retro edition —', W / 2, H / 2 - 46);

  ctx.shadowBlur = 0;

  blinkTimer += dt;
  if (Math.floor(blinkTimer * 2) % 2 === 0) {
    ctx.fillStyle = '#a0c4ff';
    ctx.font      = 'bold 20px "Courier New", monospace';
    ctx.fillText('[ CLICK TO PLAY ]', W / 2, H / 2 + 38);
  }

  ctx.fillStyle = '#505060';
  ctx.font      = '12px "Courier New", monospace';
  ctx.fillText('WASD / ARROWS — move   ·   MOUSE — aim   ·   CLICK — shoot', W / 2, H / 2 + 84);

  if (highScore > 0) {
    ctx.fillStyle = '#e6b800';
    ctx.font      = '15px "Courier New", monospace';
    ctx.fillText(`BEST  ${String(highScore).padStart(6, '0')}`, W / 2, H / 2 + 120);
  }

  ctx.textAlign  = 'left';
  ctx.shadowBlur = 0;
}

// ── Level Complete Overlay ───────────────────────────────────────────────────
function drawLevelCompleteOverlay() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign   = 'center';
  ctx.shadowColor = '#4ecdc4';
  ctx.shadowBlur  = 22;
  ctx.fillStyle   = '#4ecdc4';
  ctx.font        = `bold 52px "Courier New", monospace`;
  ctx.fillText(`LEVEL ${currentLevel} CLEAR!`, W / 2, H / 2 - 50);

  ctx.shadowBlur = 0;
  ctx.fillStyle  = '#e6b800';
  ctx.font       = '22px "Courier New", monospace';
  ctx.fillText(`SCORE  ${String(score).padStart(6, '0')}`, W / 2, H / 2 + 12);

  ctx.fillStyle = '#888';
  ctx.font      = '15px "Courier New", monospace';
  ctx.fillText(`Next level in ${Math.ceil(Math.max(0, levelTimer))}...`, W / 2, H / 2 + 52);

  ctx.textAlign  = 'left';
  ctx.shadowBlur = 0;
}

// ── Game Over Overlay ────────────────────────────────────────────────────────
function drawGameOverOverlay(dt) {
  gameOverAlpha = Math.min(1, gameOverAlpha + dt * 1.8);

  ctx.fillStyle = `rgba(0,0,0,${gameOverAlpha * 0.82})`;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = gameOverAlpha;
  ctx.textAlign   = 'center';
  ctx.shadowColor = '#e74c3c';
  ctx.shadowBlur  = 32;
  ctx.fillStyle   = '#e74c3c';
  ctx.font        = `bold 68px "Courier New", monospace`;
  ctx.fillText('GAME OVER', W / 2, H / 2 - 60);

  ctx.shadowBlur = 0;
  ctx.fillStyle  = '#e6b800';
  ctx.font       = '24px "Courier New", monospace';
  ctx.fillText(`SCORE  ${String(score).padStart(6, '0')}`, W / 2, H / 2 + 8);

  if (score > 0 && score >= highScore) {
    ctx.fillStyle = '#4ecdc4';
    ctx.font      = '16px "Courier New", monospace';
    ctx.fillText('★  NEW HIGH SCORE  ★', W / 2, H / 2 + 42);
  }

  if (gameOverAlpha >= 0.99) {
    blinkTimer += dt;
    if (Math.floor(blinkTimer * 2) % 2 === 0) {
      ctx.fillStyle = '#a0c4ff';
      ctx.font      = 'bold 18px "Courier New", monospace';
      ctx.fillText('[ CLICK TO RETURN TO MENU ]', W / 2, H / 2 + 88);
    }
  }

  ctx.globalAlpha = 1;
  ctx.textAlign   = 'left';
  ctx.shadowBlur  = 0;
}

// ── Game Flow ─────────────────────────────────────────────────────────────────
function startGame() {
  score   = 0;
  state   = S.PLAYING;
  player  = createPlayer();
  bullets = [];
  enemies = [];
  particles = [];
  screenShake = 0;
  blinkTimer  = 0;
  levelStart(1);
}

function levelStart(lvl) {
  currentLevel = lvl;
  const def   = getLevelDef(lvl);
  spawnQueue  = buildQueue(def);
  totalWaveEnemies = spawnQueue.length;
  enemiesKilled    = 0;
  spawnTimer  = def.interval * 0.4; // first enemy spawns quickly
  spawnInterval = def.interval;
  enemies  = [];
  bullets  = [];
  if (player) { player.x = W / 2; player.y = H / 2; }
}

function gameOver() {
  if (score > highScore) highScore = score;
  state         = S.GAME_OVER;
  gameOverAlpha = 0;
  blinkTimer    = 0;
}

// ── Update ────────────────────────────────────────────────────────────────────
function update(dt) {
  if (state === S.PLAYING) {
    updatePlaying(dt);
  } else if (state === S.LEVEL_COMPLETE) {
    levelTimer -= dt;
    tickParticles(dt);
    if (levelTimer <= 0) {
      levelStart(currentLevel + 1);
      state = S.PLAYING;
    }
  }
}

function updatePlaying(dt) {
  screenShake = Math.max(0, screenShake - dt * 9);

  // ── Player movement ──
  let dx = 0, dy = 0;
  if (keys['ArrowLeft']  || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (keys['ArrowUp']    || keys['w'] || keys['W']) dy -= 1;
  if (keys['ArrowDown']  || keys['s'] || keys['S']) dy += 1;
  const mag = Math.sqrt(dx * dx + dy * dy);
  player.moving = mag > 0;
  if (player.moving) {
    player.x = Math.max(player.radius, Math.min(W - player.radius, player.x + (dx / mag) * player.speed * dt));
    player.y = Math.max(player.radius, Math.min(H - player.radius, player.y + (dy / mag) * player.speed * dt));
  }

  // ── Aim ──
  player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  // ── Walk animation ──
  if (player.moving) {
    player.animTimer += dt;
    if (player.animTimer > 0.1) { player.animTimer = 0; player.animFrame = (player.animFrame + 1) % 4; }
  }

  // ── Shoot ──
  player.shootCD    = Math.max(0, player.shootCD - dt);
  player.muzzleFlash = Math.max(0, player.muzzleFlash - dt);
  if (mouse.down && player.shootCD <= 0) {
    fireBullet(player);
    player.shootCD = player.shootCDMax;
  }

  // ── Invincibility ──
  player.invTimer = Math.max(0, player.invTimer - dt);

  // ── Bullets ──
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.age += dt;
    if (b.age > 1.8 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20)
      bullets.splice(i, 1);
  }

  // ── Spawn ──
  if (spawnQueue.length > 0) {
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      enemies.push(createEnemy(spawnQueue.pop()));
    }
  }

  // ── Enemies ──
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.animT    += dt;
    e.hitFlash  = Math.max(0, e.hitFlash - dt * 7);

    // AI movement
    const tdx = player.x - e.x, tdy = player.y - e.y;
    const dist = Math.sqrt(tdx * tdx + tdy * tdy);
    if (dist > 0) {
      let nx = tdx / dist, ny = tdy / dist;
      if (e.type === 'runner') {
        e.zigTimer += dt;
        if (e.zigTimer > 0.45) {
          e.zigTimer = 0;
          e.zigAngle = Math.atan2(tdy, tdx) + (Math.random() - 0.5) * 1.8;
        }
        nx = Math.cos(e.zigAngle);
        ny = Math.sin(e.zigAngle);
      }
      e.x += nx * e.speed * dt;
      e.y += ny * e.speed * dt;
    }

    // Bullet → enemy collision
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 < (e.r + b.r) ** 2) {
        e.hp--;
        e.hitFlash = 0.12;
        spawnHitSpark(b.x, b.y);
        bullets.splice(j, 1);
        break;
      }
    }

    if (e.hp <= 0) {
      spawnDeathBurst(e.x, e.y, ETYPES[e.type].color);
      score += e.scoreVal * currentLevel;
      enemiesKilled++;
      enemies.splice(i, 1);
      continue;
    }

    // Enemy → player collision
    if (player.invTimer <= 0 && (e.x - player.x) ** 2 + (e.y - player.y) ** 2 < (e.r + player.radius) ** 2) {
      player.hp--;
      player.invTimer = player.invDur;
      screenShake = 0.55;
      if (player.hp <= 0) { gameOver(); return; }
    }
  }

  tickParticles(dt);

  // ── Level complete ──
  if (spawnQueue.length === 0 && enemies.length === 0) {
    state      = S.LEVEL_COMPLETE;
    levelTimer = 3.0;
  }
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw(dt) {
  ctx.clearRect(0, 0, W, H);

  if (state === S.MENU) { drawMenu(dt); return; }

  // Screen shake transform
  const sx = screenShake > 0 ? (Math.random() - 0.5) * screenShake * 18 : 0;
  const sy = screenShake > 0 ? (Math.random() - 0.5) * screenShake * 18 : 0;
  ctx.save();
  ctx.translate(sx, sy);

  drawBg(false);
  drawParticles();
  for (const e of enemies) drawEnemy(e);
  for (const b of bullets) drawBullet(b);
  if (player && state !== S.GAME_OVER) drawPlayer(player);

  ctx.restore();

  // Overlays (no shake)
  if (state === S.PLAYING)         drawHUD();
  if (state === S.LEVEL_COMPLETE)  { drawHUD(); drawLevelCompleteOverlay(); }
  if (state === S.GAME_OVER)       drawGameOverOverlay(dt);
}

// ── Main Loop ─────────────────────────────────────────────────────────────────
let lastT = null;
function loop(ts) {
  const dt = lastT == null ? 0 : Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;
  update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
